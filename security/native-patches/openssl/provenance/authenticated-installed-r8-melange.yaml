              	*[\*\?\[]*)
              		echo "ERROR: paths entry \"$root\" must not contain a glob pattern; name each directory" >&2
              		exit 1
              		;;
              	esac
              	extra="$extra $root"
              done
              set +f
              for root in $extra; do

              	if [ ! -d "$PACKAGE_DIR/$root" ]; then
              		echo "ERROR: paths entry \"$root\" does not exist in the package" >&2
              		exit 1
              	fi

              	if [ "false" = "true" ]; then

              		split_root "$root" "/home/build/melange-out/openssl-4.0-doc/$root"
              	else
              		split_root "$root" "/home/build/melange-out/openssl-4.0-doc/usr/share/man"
              	fi
