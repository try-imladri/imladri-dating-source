package:
  name: openssl-4.0
  version: 4.0.3
  epoch: 8
  description: the OpenSSL cryptography suite
  annotations:
    toolchain-stream: "true"
    toolchain-stream-pkgs: openssl-4.0-dev
  commit: 53fb2f6751f832fa61ddba06cb8a40dbba5f409f
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - openssl=4.0.3-r8
  cpe:
    vendor: openssl
    product: openssl
  resources:
    cpu: "9"
    memory: 7Gi
  test-resources:
    cpu: "3"
    memory: 4Gi
environment:
  contents:
    build_repositories:
      - https://apk.cgr.dev/chainguard
    packages:
      - binutils=2.47-r1
      - brotli-dev=1.2.0-r6
      - brotli=1.2.0-r6
      - build-base=1-r10
      - busybox=1.38.0-r3
      - ca-certificates-bundle=20260909-r2
      - cyrus-sasl-heimdal-libs=2.1.28-r58
      - gcc=16.2.0-r1
      - gdbm=1.26-r7
      - git=2.56.0-r2
      - glibc-2.44-dev=2.44-r8
      - glibc-2.44-locale-posix=2.44-r8
      - glibc-2.44=2.44-r8
      - gmp=6.3.0-r10
      - heimdal-libs=7.8.0-r54
      - isl=0.28-r4
      - keyutils-libs=1.6.3-r41
      - krb5-conf=1.0-r10
      - krb5-libs=1.22.2-r5
      - ld-linux-2.44=2.44-r8
      - libatomic=16.2.0-r1
      - libbrotlicommon1=1.2.0-r6
      - libbrotlidec1=1.2.0-r6
      - libbrotlienc1=1.2.0-r6
      - libbz2-1=1.0.8-r25
      - libcom_err=1.47.4-r3
      - libcrypt1-2.44=2.44-r8
      - libcurl-openssl4=8.23.0-r0
      - libexpat1=2.9.0-r0
      - libgcc=16.2.0-r1
      - libgomp=16.2.0-r1
      - libidn2=2.3.8-r10
      - libldap-2.7=2.7.1-r2
      - libnghttp2-14=1.70.0-r5
      - libpcre2-8-0=10.49-r1
      - libpsl=0.23.3-r2
      - libquadmath=16.2.0-r1
      - libstdc++-dev=16.2.0-r1
      - libstdc++=16.2.0-r1
      - libunistring=1.5-r0
      - libverto=0.3.2-r9
      - libxcrypt-dev=4.5.2-r6
      - libxcrypt=4.5.2-r6
      - libzstd1=1.5.7-r10
      - linux-headers=7.3-r0
      - make=4.4.1-r15
      - mpc=1.4.1-r1
      - mpfr=4.2.2-r3
      - ncurses-terminfo-base=6.6.20261017-r0
      - ncurses=6.6.20261017-r0
      - nghttp3=1.18.0-r1
      - ngtcp2=1.25.0-r5
      - openssf-compiler-options=20250904-r11
      - openssl-4.0-libcrypto=4.0.3-r7
      - openssl-4.0-libssl=4.0.3-r7
      - openssl-provider-legacy-allowed=4.0.3-r1
      - patch=2.8-r10
      - perl=5.44.0-r1
      - pkgconf=3.0.10-r0
      - posix-cc-wrappers=2-r10
      - readline=8.3-r3
      - scanelf=1.3.11-r3
      - sqlite-libs=3.54.1-r0
      - wolfi-baselayout=20230201-r30
      - zlib=1.3.2.1_rc20260921-r0
  accounts:
    run-as: ""
    users:
      - username: build
        uid: 1000
        gid: 1000
        shell: ""
        homedir: /home/build
    groups:
      - groupname: build
        gid: 1000
        members:
          - build
  archs:
    - amd64
  environment:
    CFLAGS: -g -ffile-prefix-map=/home/build=/usr/src/openssl-4.0
    COMPOSER_CACHE_DIR: /var/cache/melange/composer
    GOFLAGS: ""
    GOMODCACHE: /var/cache/melange/gomodcache
    GOPATH: /home/build/.cache/go
    GOTOOLCHAIN: local
    HOME: /home/build
    PIP_CACHE_DIR: /var/cache/melange/pip
    PYTHONHASHSEED: "0"
    RUST_LOG: uv=debug,info
    UV_CACHE_DIR: /var/cache/melange/uv
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
    npm_config_cache: /var/cache/melange/npm
    npm_config_git: /usr/bin/git
    npm_config_ignore_scripts: "true"
    npm_config_script_shell: /bin/sh
    npm_config_shell: /bin/sh
pipeline:
  - uses: git-checkout
    with:
      cherry-picks: |
        openssl-4.0/7c7b9684f868c5c0de74bdd34ce07b0fe739631d: fix regression in x509 app
      expected-commit: af1775b60dfa141a4ad762585052cabeb9f37e9e
      repository: https://github.com/openssl/openssl
      tag: openssl-4.0.3
    pipeline:
      - runs: |
          #!/bin/sh
          set -eu
          msg() { echo "[git checkout]" "$@"; }
          fail() {
          	msg FAIL "$@"
          	exit 1
          }
          vr() {
          	msg "execute:" "$@"
          	"$@"
          }
          retry_with_backoff() {
          	local max_retries=$1
          	local initial_backoff=$2
          	local max_backoff=$3
          	shift 3
          	local attempt=0
          	local backoff=$initial_backoff

          	while [ $attempt -le "$max_retries" ]; do
          		if [ $attempt -gt 0 ]; then
          			msg "Retry attempt $attempt/$max_retries after ${backoff}s backoff..."
          		fi

          		if "$@"; then
          			return 0
          		fi

          		attempt=$((attempt + 1))
          		if [ $attempt -gt "$max_retries" ]; then
          			msg "All $max_retries retry attempts exhausted"
          			return 1
          		fi

          		local jitter=0
          		if [ -n "$RANDOM" ]; then
          			jitter=$((RANDOM % (backoff + 1)))
          		else

          			jitter=$((($$ * attempt) % (backoff + 1)))
          		fi

          		local sleep_time=$((backoff + jitter))
          		msg "Waiting ${sleep_time}s before retry (backoff: ${backoff}s, jitter: ${jitter}s)..."
          		sleep $sleep_time

          		backoff=$((backoff * 2))
          		if [ $backoff -gt "$max_backoff" ]; then
          			backoff=$max_backoff
          		fi
          	done

          	return 1
          }
          process_cherry_picks() {
          	local cpicksf="$1" count=0
          	local fetched_branches=""
          	local sdate=${SOURCE_DATE_EPOCH:-0}
          	if [ "$sdate" -lt 315532800 ]; then
          		msg "Setting commit date to Jan 1, 1980 (SOURCE_DATE_EPOCH found ${SOURCE_DATE_EPOCH:-(not set)})"
          		sdate=315532800
          	fi
          	if [ -z "$cpicksf" ]; then
          		return 0
          	fi
          	if [ ! -f "$cpicksf" ]; then
          		msg "cherry picks input '$cpicksf' is not a file"
          		return 1
          	fi

          	local line="" branch="" hash="" comment="" unshallow_arg is_shallow
          	while IFS= read -r line; do

          		line=${line%%#*}
          		[ -z "$line" ] && continue

          		if ! echo "$line" | grep -q ':'; then
          			msg "Invalid format, expected '[branch/]commit: comment'. Found: $line"
          			return 1
          		fi

          		branch=${line%%:*}
          		comment=${line#*:}

          		comment=$(
          			set -f
          			echo $comment
          		)

          		if [ -z "$comment" ]; then
          			msg "Empty comment for cherry-pick: $line"
          			return 1
          		fi

          		hash=${branch##*/}

          		[ "$branch" != "$hash" ] && branch=${branch%/*} || branch=""

          		unshallow_arg=""
          		is_shallow=$(git rev-parse --is-shallow-repository)
          		if [ "$is_shallow" = "true" ]; then
          			unshallow_arg="--unshallow"
          		fi

          		if [ -n "$branch" ]; then
          			case " $fetched_branches " in
          			*" $branch "*) ;;
          			*)
          				vr git fetch $unshallow_arg origin "$branch:$branch" || {
          					msg "failed to fetch branch $branch"
          					return 1
          				}
          				fetched_branches="$fetched_branches $branch "
          				;;
          			esac
          		fi

          		vr env \
          			GIT_COMMITTER_DATE="@$sdate" \
          			git cherry-pick -x "$hash" || {
          			msg "failed to cherry-pick $hash from branch $branch"
          			return 1
          		}

          		msg "Cherry-picked $hash from $branch with comment: $comment"

          		count=$((count + 1))
          	done <"$cpicksf"

          	if [ $count -gt 0 ]; then
          		msg "applied $count cherry-pick(s). head is now $(git rev-parse HEAD)"
          	fi
          }
          main() {
          	local repo=$1 dest=${2:-.} depth=${3:-"unset"} branch=$4
          	local tag=$5 expcommit=$6 recurse=${7:-false}
          	local cherry_pick="$8" sparse_paths="$9"
          	local max_retries="${10:-3}" initial_backoff="${11:-2}" max_backoff="${12:-60}"
          	local shallow_submodules="${13:-false}" submodule_jobs="${14:-1}"
          	local expected_commit_is_branch_tip="${15:-false}"
          	msg "repo='$repo' dest='$dest' depth='$depth' branch='$branch'" \
          		"tag='$tag' expcommit='$expcommit' recurse='$recurse'" \
          		"sparse_paths='$sparse_paths' max_retries='$max_retries'" \
          		"initial_backoff='$initial_backoff' max_backoff='$max_backoff'" \
          		"shallow_submodules='$shallow_submodules' submodule_jobs='$submodule_jobs'" \
          		"expected_commit_is_branch_tip='$expected_commit_is_branch_tip'"

          	case "$recurse" in
          	true | false) : ;;
          	*) fail "recurse must be true or false, not '$recurse'" ;;
          	esac
          	case "$shallow_submodules" in
          	true | false) : ;;
          	*) fail "shallow_submodules must be true or false, not '$shallow_submodules'" ;;
          	esac
          	case "$expected_commit_is_branch_tip" in
          	true | false) : ;;
          	*) fail "expected-commit-is-branch-tip must be true or false," \
          		"not '$expected_commit_is_branch_tip'" ;;
          	esac

          	[ -n "$repo" ] || fail "repository not provided"

          	if [ -z "$branch" ] && [ -z "$tag" ]; then
          		msg "Warning: you have not specified a branch or tag."
          	elif [ -n "$branch" ] && [ -n "$tag" ]; then
          		fail "both branch ($branch) and tag ($tag) are specified."
          	fi

          	if [ "$expected_commit_is_branch_tip" = "true" ]; then
          		[ -z "$tag" ] ||
          			fail "expected-commit-is-branch-tip is only valid with" \
          				"'branch', not 'tag'."
          		[ -n "$branch" ] ||
          			fail "expected-commit-is-branch-tip requires 'branch' to be set."
          		[ -n "$expcommit" ] ||
          			fail "expected-commit-is-branch-tip requires 'expected-commit'" \
          				"to be set."
          	fi

          	[ -n "$expcommit" ] ||
          		msg "Warning: no expected-commit"

          	local flags="" depthflag="" dest_fullpath="" workdir=""
          	local remote="origin" rcfile="" rc="" quiet="--quiet"
          	flags="--config=advice.detachedHead=false"
          	[ -n "$branch" ] && flags="$flags --branch=$branch"
          	[ -n "$tag" ] && flags="$flags --branch=$tag"
          	if [ "$recurse" = "true" ]; then
          		flags="$flags --recurse-submodules --jobs=$submodule_jobs"
          		[ "$shallow_submodules" = "true" ] && flags="$flags --shallow-submodules"
          	fi
          	[ -n "$sparse_paths" ] && flags="$flags --sparse --filter=blob:none"

          	if [ "$depth" = "unset" ]; then
          		depth=1
          		if [ -n "$branch" ] && [ -n "$expcommit" ] &&
          			[ "$expected_commit_is_branch_tip" = "false" ]; then

          			depth=-1
          		fi
          	fi

          	[ "$depth" = "-1" ] || depthflag="--depth=$depth"

          	workdir=$(mktemp -d)
          	rcfile=$(mktemp)
          	mkdir -p "$dest"
          	dest_fullpath=$(realpath "$dest")

          	vr git config --global --add safe.directory "$workdir"
          	vr git config --global --add safe.directory "$dest_fullpath"

          	vr git config --global maintenance.auto false
          	vr git config --global gc.auto 0

          	msg "Attempting git clone with retry (max_retries=$max_retries, initial_backoff=${initial_backoff}s, max_backoff=${max_backoff}s)"

          	retry_with_backoff "$max_retries" "$initial_backoff" "$max_backoff" \
          		git clone $quiet "--origin=$remote" \
          		"--config=user.name=Melange Build" \
          		"--config=user.email=melange-build@cgr.dev" \
          		$flags \
          		${depthflag:+"${depthflag}"} "$repo" "$workdir" ||
          		fail "git clone failed after $max_retries retries"

          	msg "cloned from $(cd "$workdir" && git remote get-url origin)"

          	vr cd "$workdir"

          	if [ -n "$sparse_paths" ]; then
          		msg "Configuring sparse-checkout with paths: $sparse_paths"

          		vr git sparse-checkout set --cone $sparse_paths ||
          			fail "failed to configure sparse-checkout --filter=blob:none"
          	fi

          	msg "tar -c . | tar -C \"$dest_fullpath\" -x"
          	(
          		tar -c .
          		echo $? >"$rcfile"
          	) | tar -C "$dest_fullpath" -x --no-same-owner

          	read rc <"$rcfile" || fail "failed to read rc file"
          	[ "$rc" -eq 0 ] || fail "tar creation in $workdir failed"

          	rm -rf "$workdir"
          	vr cd "$dest_fullpath"
          	vr git config --global --add safe.directory "$dest_fullpath"

          	local foundcommit="" tagobj=""
          	if [ -z "$tag" ]; then
          		foundcommit=$(git rev-parse --verify HEAD)
          		if [ -n "$expcommit" ] && [ "$expcommit" != "$foundcommit" ]; then
          			if [ "$expected_commit_is_branch_tip" = "true" ]; then

          				fail "expected-commit $expcommit is not the tip of branch" \
          					"${branch:-HEAD} ($foundcommit); the branch advanced" \
          					"or the version was bumped without updating" \
          					"expected-commit"
          			elif [ "$depth" = "-1" ]; then

          				if git merge-base --is-ancestor "$expcommit" "$foundcommit"; then
          					msg "expected commit $expcommit on ${branch:-HEAD}," \
          						"got $foundcommit, performing reset"
          					vr git reset --hard "$expcommit"
          				else
          					fail "expected commit $expcommit is not reachable from" \
          						"${branch:-HEAD} (tip $foundcommit); the branch may" \
          						"have diverged from the pinned commit -- update" \
          						"expected-commit"
          				fi
          			else
          				fail "expected commit $expcommit on ${branch:-HEAD}," \
          					"got $foundcommit, set depth to -1 to attempt a reset"
          			fi
          		fi
          		msg "tip of ${branch:-HEAD} is commit $foundcommit"
          		process_cherry_picks "$cherry_pick" || fail "failed to apply cherry-pick"
          		return 0
          	fi

          	retry_with_backoff "$max_retries" "$initial_backoff" "$max_backoff" \
          		vr git fetch $quiet $remote ${depthflag:+"${depthflag}"} --no-tags \
          		"+refs/tags/$tag:refs/$remote/tags/$tag" ||
          		fail "git fetch of tag $tag failed after $max_retries retries"
          	vr git checkout $quiet "$remote/tags/$tag"

          	foundcommit=$(git rev-parse --verify HEAD)
          	if [ -z "$expcommit" ] || [ "$expcommit" = "$foundcommit" ]; then
          		msg "tag $tag is $foundcommit"
          	else

          		tagobj=$(git rev-parse --verify --end-of-options \
          			"refs/$remote/tags/$tag")
          		if [ "$expcommit" != "$tagobj" ]; then
          			[ "$tagobj" != "$expcommit" ] &&
          				msg "tag object hash was $tagobj"
          			fail "Expected commit $expcommit for $tag, found $foundcommit"
          		fi

          		msg "Warning: The provided expected-commit ($expcommit)"
          		msg "was the hash of the annotated tag object for $tag."
          		msg "Update to set expected-commit to $foundcommit"
          	fi

          	process_cherry_picks "$cherry_pick" ||
          		fail "failed to apply cherry-pick"

          	return 0
          }
          cpickf=$(mktemp) || {
          	echo "failed mktemp"
          	exit 1
          }
          cat >"$cpickf" <<"END_CHERRY_PICKS"
          openssl-4.0/7c7b9684f868c5c0de74bdd34ce07b0fe739631d: fix regression in x509 app

          END_CHERRY_PICKS
          main \
          	"https://github.com/openssl/openssl" "." \
          	"unset" "" \
          	"openssl-4.0.3" "af1775b60dfa141a4ad762585052cabeb9f37e9e" \
          	"false" "$cpickf" \
          	"" \
          	"3" "2" \
          	"60" \
          	"false" "1" \
          	"false"
          rm -f "$cpickf"
  - uses: patch
    with:
      patches: |
        0001-fips-block-HMAC-calculation-with-unapproved-digests.patch
        0001-fips-retain-FIPS-140-2-TLSv1.2-connectivity.patch
        0001-Remove-pre-share-from-default-TLS-groups.patch
        0001-Look-for-providers-in-ossl-modules-4-before-ossl-mod.patch
        0001-Revert-fips-Align-PKCS5_PBKDF2_HMAC-defaults-with-EV.patch
        0001-Chainguard-Cryptographic-Hardening.patch
    pipeline:
      - runs: |
          strip_components=$(
          	cat <<'MELANGE_STRIP_EOF'
          1
          MELANGE_STRIP_EOF
          )
          strip_components=$(printf '%s' "$strip_components" | sed 's/^[[:space:]]*//' | tr -d '\n')
          fuzz=$(
          	cat <<'MELANGE_FUZZ_EOF'
          2
          MELANGE_FUZZ_EOF
          )
          fuzz=$(printf '%s' "$fuzz" | sed 's/^[[:space:]]*//' | tr -d '\n')
          case "$strip_components" in
          '' | *[!0-9]*)
          	printf 'ERROR: strip-components must be a non-negative integer, got: %s\n' "$strip_components" >&2
          	exit 1
          	;;
          esac
          case "$fuzz" in
          '' | *[!0-9]*)
          	printf 'ERROR: fuzz must be a non-negative integer, got: %s\n' "$fuzz" >&2
          	exit 1
          	;;
          esac
          series=$(
          	cat <<'MELANGE_SERIES_EOF'

          MELANGE_SERIES_EOF
          )
          series=$(printf '%s' "$series" | sed 's/^[[:space:]]*//' | tr -d '\n')
          case "$series" in
          *"'"* | *'`'* | *'$('* | *'${'* | *';'* | *'|'* | *'&'* | *'>'* | *'<'*)
          	printf 'ERROR: series path contains invalid characters\n' >&2
          	exit 1
          	;;
          esac
          if [ -z "$series" ]; then
          	patches_input=$(
          		cat <<'MELANGE_PATCHES_EOF'
          0001-fips-block-HMAC-calculation-with-unapproved-digests.patch
          0001-fips-retain-FIPS-140-2-TLSv1.2-connectivity.patch
          0001-Remove-pre-share-from-default-TLS-groups.patch
          0001-Look-for-providers-in-ossl-modules-4-before-ossl-mod.patch
          0001-Revert-fips-Align-PKCS5_PBKDF2_HMAC-defaults-with-EV.patch
          0001-Chainguard-Cryptographic-Hardening.patch

          MELANGE_PATCHES_EOF
          	)
          	patches_input=$(printf '%s' "$patches_input" | sed 's/^[[:space:]]*//')
          	if [ -n "$patches_input" ]; then
          		series=$(mktemp)
          		printf '%s\n' "$patches_input" | awk '{ for(i = 1; i <= NF; i++) { print $i; } }' >"$series"
          	else
          		printf 'ERROR: Neither patches or series was set.\n' >&2
          		exit 1
          	fi
          else

          	if [ ! -f "$series" ]; then
          		printf 'ERROR: series file does not exist: %s\n' "$series" >&2
          		exit 1
          	fi
          fi
          grep -v -E '^(#|$)' "$series" | while IFS= read -r patchfile || [ -n "$patchfile" ]; do

          	case "$patchfile" in
          	*"'"* | *'`'* | *'$('* | *'${'* | *';'* | *'|'* | *'&'* | *'>'* | *'<'*)
          		printf 'ERROR: patch file path contains invalid characters: %s\n' "$patchfile" >&2
          		exit 1
          		;;
          	esac
          	printf 'applying patch file %s\n' "$patchfile"
          	patch "-p${strip_components}" "--fuzz=${fuzz}" --verbose <"$patchfile"
          done
  - name: Configure and build
    runs: |
      perl ./Configure \
      	--prefix=/usr \
      	--libdir=lib \
      	--openssldir=/etc/ssl \
      	enable-brotli \
      	enable-ec_nistp_64_gcc_128 \
      	enable-ktls \
      	enable-pie \
      	no-aria \
      	enable-bf \
      	enable-camellia \
      	enable-cast \
      	no-dtls1 \
      	no-ec_explicit_curves \
      	no-ec2m \
      	no-gost \
      	no-idea \
      	no-integrity-only-ciphers \
      	no-mdc2 \
      	enable-ocb \
      	enable-psk \
      	no-pvkkdf \
      	enable-rc2 \
      	enable-rc4 \
      	enable-rc5 \
      	enable-rmd160 \
      	no-seed \
      	no-sm2 \
      	no-sm2-precomp \
      	enable-sm3 \
      	no-sm4 \
      	enable-srp \
      	no-tls1 \
      	no-tls1_1 \
      	no-weak-ssl-ciphers \
      	no-whirlpool \
      	-Wa,--noexecstack
      perl configdata.pm --dump
      make build_all_generated
      SRCDIR=$(mktemp -d)
      cp -r . $SRCDIR/
      mkdir -p /home/build/melange-out/openssl-4.0-dbg/usr/src/
      mv $SRCDIR /home/build/melange-out/openssl-4.0-dbg/usr/src/openssl-4.0
      chmod 755 /home/build/melange-out/openssl-4.0-dbg/usr/src/openssl-4.0
      make -j$(nproc)
  - uses: autoconf/make-install
    pipeline:
      - runs: |
          make -C "." install DESTDIR="/home/build/melange-out/openssl-4.0" V=1
      - runs: |
          find /home/build/melange-out/openssl-4.0 -name '*.la' -print -exec rm \{} \;
  - name: Run full tests, without Chainguard Cryptographic Hardening patches
    runs: |
      patch -p1 -R <0001-Chainguard-Cryptographic-Hardening.patch
      patch -p1 -R <0001-Remove-pre-share-from-default-TLS-groups.patch
      make tests HARNESS_JOBS=10
  - runs: |
      rm /home/build/melange-out/openssl-4.0/etc/ssl/openssl.cnf
      rm /home/build/melange-out/openssl-4.0/etc/ssl/openssl.cnf.dist
      rm /home/build/melange-out/openssl-4.0/etc/ssl/ct_log_list.cnf
      rm /home/build/melange-out/openssl-4.0/etc/ssl/ct_log_list.cnf.dist
      rm /home/build/melange-out/openssl-4.0/usr/lib/ossl-modules/legacy.so
subpackages:
  - name: openssl-4.0-dbg
    pipeline:
      - uses: split/debug
        pipeline:
          - runs: |
              PACKAGE_DIR="/home/build/melange-out/openssl-4.0"
              if [ -n "" ]; then
              	PACKAGE_DIR="/home/build/melange-out/"
              fi
              if [ "$PACKAGE_DIR" = "/home/build/melange-out/openssl-4.0-dbg" ]; then
              	echo "ERROR: Package can not split files from itself!" && exit 1
              fi
              mkdir -p "$PACKAGE_DIR/.dbg-tmp"
              scanelf -Ry "$PACKAGE_DIR"/* | while read type src; do
              	if [ "$type" != ET_DYN ]; then
              		continue
              	fi
              	dst=/home/build/melange-out/openssl-4.0-dbg/usr/lib/debug/${src#"$PACKAGE_DIR"/}.debug
              	mkdir -p "${dst%/*}"
              	ino=$(stat -c %i "$src")
