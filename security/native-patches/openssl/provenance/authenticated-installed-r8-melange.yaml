update:
  enabled: true
  manual: false
  require-sequential: false
  github:
    identifier: openssl/openssl
    strip-prefix: openssl-
    tag-filter-prefix: openssl-4.0.
var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+).*
    replace: $1
    to: major-version
test:
  environment:
    contents:
      packages:
        - bash
        - busybox
        - curl
        - git
        - git-daemon
        - hardening-check
        - ldd-check
        - openssl
        - openssl-4.0
        - python3
        - wait-for-it
        - wget
    accounts:
      run-as: ""
      users:
        - username: build
          uid: 1000
          gid: 1000
          shell: ""
          homedir: ""
      groups:
        - groupname: build
          gid: 1000
          members:
            - build
  pipeline:
    - uses: test/tw/ldd-check
      pipeline:
        - name: check for missing library dependencies using ldd
          runs: |
            ldd-check \
            	--files="" \
            	--exclude-files="" \
            	--packages="openssl-4.0" \
            	--extra-library-paths="" \
            	--verbose="false"
    - uses: test/hardening-check
      with:
        package-match: |-
          openssl-4.0$
          openssl-4.0-libcrypto$
          openssl-4.0-libssl$
      pipeline:
        - name: check files for hardening flags
          runs: |
            cat <<"END_CHECK" >/tmp/hardening-check-files
            #!/bin/bash
            set -o errexit -o nounset -o errtrace -o pipefail
            r=0

            checkfile() {
                arch_skip=
                # full cfprotection is x86 only for now
                if [ "x86_64" = "aarch64" ]; then
                    arch_skip=--nocfprotection
                fi
                # the branch protection check is ARM only for now
                [ "x86_64" = "aarch64" ] || arch_skip=--nobranchprotection

                ### <DELETE WHEN GLIBC OPENSSF HARDENING IS RE-ENABLED>
                if [ "x86_64" = "aarch64" ]; then
                  arch_skip="$arch_skip --nobranchprotection"
                fi
                ### </DELETE>

                hardening-check $arch_skip  --color $1
            }

            debug() {
                [ "$DEBUG" = "true" ] || return 0
                echo "$@"
            }
            packages=false
            if [ "$1" = "--package" ]; then
                packages=true
                shift
            fi

            TEMP_D=$(mktemp -d)
            trap "rm -Rf '${TEMP_D}'" EXIT

            errors=0
            files=0
            DEBUG=false
            command -v readelf >/dev/null 2>&1 ||
                { echo "ERROR: You need 'readelf' executable"; exit 1; }

            if [ "$packages" = "true" ]; then
                flist="${TEMP_D}/files"
                cd /
                for pkg in "$@"; do
                    apk info --quiet -L "$pkg" > "$flist" || {
                        echo "failed to list contents of $pkg"
                        exit 1
                    }
                    debug ":: $pkg"
                    while read f; do
                        # apk info -L adds a blank line at the end.
                        [ -z "$f" ] && continue
                        [ -d "$f" ] && continue
                        outf="${TEMP_D}/version.out"
                        errf="${TEMP_D}/version.err"
                        set +e
                        LANG=C readelf -hW "$f" > "$outf" 2> "$errf"
                        rc=$?
                        set -e
                        if grep -qi "readelf: Error: Not an ELF file" "$errf"; then
                            debug "$f: not an ELF file"
                            continue
                        fi
                        if grep -qi "readelf: Error: .*: Failed to read file.*" "$errf"; then
                            debug "$f: not an ELF file"
                            continue
                        fi
                        checkfile "$f" || errors=$((errors+1))
                        files=$((files+1))
                    done < "$flist"
                done
            else
                for path in "$@"; do
                    if [ -f "$path" ]; then
                        checkfile "$path" || errors=$((errors+1))
                        files=$((files+1))
                    else
                        echo "ERROR: $path is not a file!"
                        exit 2
                    fi
                done
            fi

            result=FAIL
            rc=1
            [ $errors -eq 0 ] && { result="PASS"; rc=0; }

            echo "$result: $files checked. $errors hardening failures found."
            exit $rc
            END_CHECK
            chmod 755 /tmp/hardening-check-files
            pkgmatch='openssl-4.0$
            openssl-4.0-libcrypto$
            openssl-4.0-libssl$'
            pkgname='openssl-4.0'
            if [ "${pkgmatch}" = "DEFAULT" ]; then
            	pkgmatch="^${pkgname}"
            fi
            pfile=/tmp/packages.list
            if ! apk info -L >"$pfile" 2>"$pfile.err"; then
            	echo "ERROR: apk info -L failed"
            	cat "$pfile" "$pfile.err"
            	exit 1
            fi
            packages=$(grep "$pkgmatch" "$pfile") || :
            set -- ${packages}
            if [ $# -eq 0 ]; then
            	echo "packages:"
            	sed 's,^,>  ,' "$pfile"
            	echo "ERROR: package-match '$pkgmatch'" \
            		"did not match any installed packages (see list above)"
            	exit 1
            fi
            echo "checking $# packages: $*"
            /tmp/hardening-check-files --package "$@"
    - runs: |
        openssl --version
        openssl --help
    - name: Measure the size of the first ClientHello
      uses: test/daemon-check-output
      with:
        expected_output: ACCEPT
        post: |
          # A ClientHello that does not fit into a single TCP segment gets
          # silently dropped by some middleboxes, AWS Network Firewall among
          # them. An IPv6 header (40 bytes) and a TCP header with options (32
          # bytes) leave 1428 bytes of a 1500 byte MTU, so keep margin below
          # that.
          max_clienthello=1400

          # Handshake against the local server with every record dumped, then
          # report how big the first ClientHello was. -msg prints the length
          # of the handshake message, e.g.
          #   >>> TLS 1.3, Handshake [length 0111], ClientHello
          # to which the 5 byte TLS record header is added for the size that
          # actually goes out on the wire.
          clienthello_size() {
            log=/tmp/clienthello/client.log
            OPENSSL_CONF="$1" openssl s_client -connect 127.0.0.1:4433 \
              -servername localhost -CAfile /tmp/clienthello/server.crt -msg \
              </dev/null >"$log" 2>&1
            grep -q "Verify return code: 0 (ok)" "$log"
            hexlen=$(sed -n '/^>>> TLS.*, Handshake \[length .*\], ClientHello$/ {
                       s/.*\[length \([0-9a-f]*\)\].*/\1/p; q; }' "$log")
            if [ -z "$hexlen" ]; then
              echo "no ClientHello found in s_client -msg output" >&2
              cat "$log" >&2
              return 1
            fi
            echo $((0x$hexlen + 5))
          }

          # What everything linked against libssl gets, by way of the
          # openssl.cnf shipped in libcrypto3.
          size="$(clienthello_size /etc/ssl/openssl.cnf)"
          echo "first ClientHello with /etc/ssl/openssl.cnf: $size bytes"
          [ "$size" -le "$max_clienthello" ]

          # And what applications opting out of the system configuration get
          # from the group list compiled into libssl.
          size="$(clienthello_size /dev/null)"
          echo "first ClientHello with built-in defaults: $size bytes"
          [ "$size" -le "$max_clienthello" ]
        setup: |
          mkdir -p /tmp/clienthello
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout /tmp/clienthello/server.key \
            -out /tmp/clienthello/server.crt
        start: /usr/bin/openssl s_server -accept 127.0.0.1:4433 -naccept 10 -www -cert /tmp/clienthello/server.crt -key /tmp/clienthello/server.key
      pipeline:
        - name: start daemon on localhost
          runs: |
            info() { echo "$@"; }
            term_wait_kill() {
            	local pid="$1" ttime="$2" ktime="$3" n="" killrc="0"
            	n=0
            	[ -d "/proc/$pid" ] || {
            		info "twk: pid $pid did not exist"
            		return 0
            	}
            	while [ $n -lt $ttime ] && n=$((n + 1)); do
            		if [ ! -d "/proc/$pid" ]; then
            			info "twk: pid $pid did not exist after $n seconds"
            			return 0
            		fi
            		sleep 1
            	done
            	if [ ! -d "/proc/$pid" ]; then
            		info "twk: pid $pid died on its own within $n seconds"
            		return 0
            	fi
            	kill -TERM "$pid" || killrc=$?
            	info "twk: SIGTERM sent to pid $pid. kill returned $killrc."
            	n=0
            	while [ $n -lt $ktime ] && n=$((n + 1)); do
            		if [ ! -d "/proc/$pid" ]; then
            			info "twk: pid $pid exited within $n seconds after SIGTERM"
            			return 0
            		fi
            		sleep 1
            	done
            	if [ ! -d "/proc/$pid" ]; then
            		info "twk: pid $pid exited within $n seconds after SIGTERM"
            		return 0
            	fi
            	kill -KILL "$pid" || killrc=$?
            	info "twk: SIGKILL sent to pid $pid [kill returned $killrc]"
            	return 0
            }
            cleanup() {

            	if [ "$$" != "$MAINPID" ]; then
            		return 0
            	fi
            	rm -Rf "$TMPD"
            }
            set +x
            MAINPID=$$
            TMPD=$(mktemp -d)
            trap cleanup EXIT
            KID=""
            OUT_F="${TMPD}/out"
            EXPECTED_F="${TMPD}/expected"
            MISSING_F="${TMPD}/missing"
            ERRORS_F="${TMPD}/errorstrings"
            ERRORS_FOUND_F="${TMPD}/errorstrings-found"
            SETUP_F="${TMPD}/setup"
            POST_F="${TMPD}/post"
            rc=0
            timeout=30
            cat >"${TMPD}/setup_input" <<'MELANGE_SETUP_EOF'
            mkdir -p /tmp/clienthello
            openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
              -subj "/CN=localhost" \
              -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
              -keyout /tmp/clienthello/server.key \
              -out /tmp/clienthello/server.crt

            MELANGE_SETUP_EOF
            setup=$(cat "${TMPD}/setup_input")
            cat >"${EXPECTED_F}" <<'MELANGE_EXPECTED_EOF'
            ACCEPT
            MELANGE_EXPECTED_EOF
            cat >"${ERRORS_F}" <<'MELANGE_ERRORS_EOF'
            ERROR
            FAIL
            FATAL
            Traceback.*most.recent.call
            Exception in thread
            java.lang.NullPointerException
            java.lang.RuntimeException
            Gem::MissingSpecError
            command not found

            MELANGE_ERRORS_EOF
            error_strings=$(cat "${ERRORS_F}")
            cat >"${TMPD}/post_input" <<'MELANGE_POST_EOF'
            # A ClientHello that does not fit into a single TCP segment gets
            # silently dropped by some middleboxes, AWS Network Firewall among
            # them. An IPv6 header (40 bytes) and a TCP header with options (32
            # bytes) leave 1428 bytes of a 1500 byte MTU, so keep margin below
            # that.
            max_clienthello=1400

            # Handshake against the local server with every record dumped, then
            # report how big the first ClientHello was. -msg prints the length
            # of the handshake message, e.g.
            #   >>> TLS 1.3, Handshake [length 0111], ClientHello
            # to which the 5 byte TLS record header is added for the size that
            # actually goes out on the wire.
            clienthello_size() {
              log=/tmp/clienthello/client.log
              OPENSSL_CONF="$1" openssl s_client -connect 127.0.0.1:4433 \
                -servername localhost -CAfile /tmp/clienthello/server.crt -msg \
                </dev/null >"$log" 2>&1
              grep -q "Verify return code: 0 (ok)" "$log"
              hexlen=$(sed -n '/^>>> TLS.*, Handshake \[length .*\], ClientHello$/ {
                         s/.*\[length \([0-9a-f]*\)\].*/\1/p; q; }' "$log")
              if [ -z "$hexlen" ]; then
                echo "no ClientHello found in s_client -msg output" >&2
                cat "$log" >&2
                return 1
              fi
              echo $((0x$hexlen + 5))
            }

            # What everything linked against libssl gets, by way of the
            # openssl.cnf shipped in libcrypto3.
            size="$(clienthello_size /etc/ssl/openssl.cnf)"
            echo "first ClientHello with /etc/ssl/openssl.cnf: $size bytes"
            [ "$size" -le "$max_clienthello" ]

            # And what applications opting out of the system configuration get
            # from the group list compiled into libssl.
            size="$(clienthello_size /dev/null)"
            echo "first ClientHello with built-in defaults: $size bytes"
            [ "$size" -le "$max_clienthello" ]

            MELANGE_POST_EOF
            post=$(cat "${TMPD}/post_input")
            set --
            while read line; do
            	[ "$line" = "" ] && continue
            	set -- "$@" "$line"
            done <"$EXPECTED_F"
            num_lines=$#
            if [ -n "$setup" ]; then
            	shbang="#!"
            	if [ "${setup#${shbang}}" = "$setup" ]; then
            		printf "%s\n" '#!/bin/sh -ex' >"${SETUP_F}"
            	fi
            	printf "%s\n" "$setup" >>"${SETUP_F}"
            	chmod 755 "${SETUP_F}"
            	info "running setup from ${SETUP_F}"
            	"${SETUP_F}" || {
            		rc=$?
            		info "ERROR: setup failed with $rc"
            		exit $rc
            	}
            fi
            if [ -n "$post" ]; then
            	shbang="#!"
            	if [ "${post#${shbang}}" = "$post" ]; then
            		printf "%s\n" '#!/bin/sh -ex' >"${POST_F}"
            	fi
            	printf "%s\n" "$post" >>"${POST_F}"
            	chmod 755 "${POST_F}"
            fi
            set -- /usr/bin/openssl s_server -accept 127.0.0.1:4433 -naccept 10 -www -cert /tmp/clienthello/server.crt -key /tmp/clienthello/server.key
            n=$#
            "$@" >"$OUT_F" 2>&1 </dev/null &
            KID=$!
            info "daemon started as pid $KID with: $*"
            info "looking for ${num_lines} lines in output within $timeout seconds"
            set --
            while read line; do
            	[ "$line" = "" ] && continue
            	set -- "$@" "$line"
            done <"$EXPECTED_F"
            found=0
            n=0
            while n=$((n + 1)); do
            	while [ $# -gt 0 ] && grep -q "$1" "$OUT_F"; do
            		info "found within $n seconds: $1"
            		found=$((found + 1))
            		shift
            	done
            	[ $# -eq 0 ] && break
            	[ -d "/proc/$KID" ] || {
            		wait $KID || rc=$?
            		info "process $KID died inside $n seconds. exited $rc"
            		break
            	}
            	if [ $n -gt $timeout ]; then
            		info "timeout $timeout seconds reached."
            		break
            	fi
            	sleep 1
            done
            while [ $# -ne 0 ]; do
            	if grep -q "$1" "$OUT_F"; then
            		info "found within $n seconds: $1"
            		found=$((found + 1))
            	else
            		info "missing expected output: $1"
            		echo "$1" >>"$MISSING_F"
            	fi
            	shift
            done
            errors_found=0
            num_error_strings=0
            if [ -z "${error_strings}" ]; then
            	info "error string checking is disabled."
            else
            	set --
            	while read line; do
            		[ "$line" = "" ] && continue
            		set -- "$@" "$line"
            	done <"$ERRORS_F"
            	num_error_strings=$#
            	for errmsg in "$@"; do
            		if out=$(grep "$errmsg" "$OUT_F"); then
            			info "ERROR: found error message '$errmsg' in output: $out"
            			errors_found=$((errors_found + 1))
            			echo "$errmsg" >>"$ERRORS_FOUND_F"
            		fi
            	done
            fi
            if [ -f "$POST_F" ]; then
            	info "running post from ${POST_F}"
            	"${POST_F}" || {
            		rc=$?
            		info "ERROR: post failed with $rc"
            	}
            fi
            info "-- begin output --"
            sed 's,^,> ,' "$OUT_F"
            info "-- end   output --"
            if [ $num_lines -eq 1 ]; then
            	line_str="line"
            else
            	line_str="lines"
            fi
            if [ $found -ne $num_lines ]; then
            	rc=1
            	info "ERROR: found $found of expected ${num_lines} ${line_str} in output."
            	info "missing:"
            	sed 's,^,> ,' "$MISSING_F"
            else
            	info "found $found of expected ${num_lines} ${line_str} in output."
            fi
            if [ $errors_found -ne 0 ]; then
            	rc=1
            	info "ERROR: matched ${errors_found} error strings below in output above:"
            	sed 's,^,> ,' "$ERRORS_FOUND_F"
            elif [ $num_error_strings -ne 0 ]; then
            	info "found 0 / ${num_error_strings} error strings in output."
            fi
            term_wait_kill "$KID" 0 30
            wait || info "wait returned $?"
            exit $rc
