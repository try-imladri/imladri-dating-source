package:
  name: sqlite
  version: 3.54.1
  epoch: 0
  description: C library which implements an SQL database engine
  commit: b0ca8c95606371be2557980059c10b34df30fa9f
  copyright:
    - license: blessing
  resources:
    cpu: "1"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 2Gi
environment:
  contents:
    build_repositories:
      - https://apk.cgr.dev/chainguard
    packages:
      - binutils=2.47-r1
      - build-base=1-r10
      - busybox=1.38.0-r3
      - ca-certificates-bundle=20260909-r2
      - gcc=16.2.0-r1
      - glibc-2.44-dev=2.44-r8
      - glibc-2.44-locale-posix=2.44-r8
      - glibc-2.44=2.44-r8
      - gmp=6.3.0-r10
      - isl=0.28-r4
      - ld-linux-2.44=2.44-r8
      - libatomic=16.2.0-r1
      - libbrotlicommon1=1.2.0-r6
      - libbrotlidec1=1.2.0-r6
      - libbrotlienc1=1.2.0-r6
      - libcrypt1-2.44=2.44-r8
      - libgcc=16.2.0-r1
      - libgomp=16.2.0-r1
      - libquadmath=16.2.0-r1
      - libstdc++-dev=16.2.0-r1
      - libstdc++=16.2.0-r1
      - libxcrypt-dev=4.5.2-r6
      - libxcrypt=4.5.2-r6
      - libzstd1=1.5.7-r10
      - linux-headers=7.2.11-r0
      - make=4.4.1-r15
      - mpc=1.4.1-r1
      - mpfr=4.2.2-r3
      - ncurses-dev=6.6.20261010-r0
      - ncurses-terminfo-base=6.6.20261010-r0
      - ncurses=6.6.20261010-r0
      - openssf-compiler-options=20250904-r11
      - openssl-4.0-libcrypto=4.0.3-r6
      - openssl-4.0-libssl=4.0.3-r6
      - openssl-provider-legacy-allowed=4.0.3-r1
      - pkgconf=3.0.9-r0
      - posix-cc-wrappers=2-r10
      - readline-dev=8.3-r3
      - readline=8.3-r3
      - scanelf=1.3.11-r3
      - sqlite-libs=3.54.0-r0
      - tcl-dev=9.1.0-r0
      - tcl=9.1.0-r0
      - tzdata=2026e-r0
      - wget=1.25.0-r20
      - wolfi-baselayout=20230201-r30
      - zlib-dev=1.3.2.1_rc20260921-r0
      - zlib=1.3.2.1_rc20260921-r0
  accounts:
    run-as: ""
    users:
      - username: build
        uid: 1000
        gid: 1000
        shell: ""
        homedir: /home/build
    groups:
      - groupname: build
        gid: 1000
        members:
          - build
  archs:
    - amd64
  environment:
    COMPOSER_CACHE_DIR: /var/cache/melange/composer
    GOFLAGS: ""
    GOMODCACHE: /var/cache/melange/gomodcache
    GOPATH: /home/build/.cache/go
    GOTOOLCHAIN: local
    HOME: /home/build
    PIP_CACHE_DIR: /var/cache/melange/pip
    PYTHONHASHSEED: "0"
    RUST_LOG: uv=debug,info
    TCL_LIBRARY: /usr/library
    UV_CACHE_DIR: /var/cache/melange/uv
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
    npm_config_cache: /var/cache/melange/npm
    npm_config_git: /usr/bin/git
    npm_config_ignore_scripts: "true"
    npm_config_script_shell: /bin/sh
    npm_config_shell: /bin/sh
pipeline:
  - uses: fetch
    with:
      expected-sha256: 387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b
      extract: "false"
      purl-name: sqlite
      purl-version: 3.54.1
      uri: https://www.sqlite.org/2026/sqlite-src-3540100.zip
    pipeline:
      - runs: |
          if [ -z "387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b" ] && [ -z "" ] && [ -z "" ]; then
          	printf "One of expected-sha256 or expected-sha512 is required\n"
          	exit 1
          fi
          bn=$(basename https://www.sqlite.org/2026/sqlite-src-3540100.zip)
          if [ -n "387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b" ]; then
          	fn="/var/cache/melange/sha256:387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b"
          	if [ -f $fn ]; then
          		printf "fetch: found $fn in cache\n"
          		cp $fn $bn
          	fi
          else
          	fn="/var/cache/melange/sha512:"
          	if [ -f $fn ]; then
          		printf "fetch: found $fn in cache\n"
          		cp $fn $bn
          	fi
          fi
          if [ ! -f $bn ]; then
          	wget '-T5' '--dns-timeout=20' '--tries=5' --random-wait --retry-connrefused --continue 'https://www.sqlite.org/2026/sqlite-src-3540100.zip'
          fi
          if [ -n "" ]; then
          	printf "fetch: Checksum validation skipped\n"
          elif [ -n "387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b" ]; then
          	printf "fetch: Expected sha256: 387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b\n"
          	sum=$(sha256sum $bn | awk '{print $1}')
          	if [ "387e7f6cad4797b17848c07d453dc6606917bb356a6cfe5a3abafd38c240c71b" != "$sum" ]; then
          		printf "fetch: Expected sha256 does not match found: $sum\n"
          		exit 1
          	fi
          else
          	printf "fetch: Expected sha512: \n"
          	sum=$(sha512sum $bn | awk '{print $1}')
          	if [ "" != "$sum" ]; then
          		printf "fetch: Expected sha512 does not match found: $sum\n"
          		exit 1
          	fi
          fi
          if [ "false" = "true" ]; then
          	tar -x '--strip-components=1' --no-same-owner -C '.' -f $bn
          fi
          if [ "false" = "true" ]; then
          	rm $bn
          fi
  - name: Extract ZIP & move it to the normal place
    runs: |
      unzip sqlite-src-3540100.zip -d ../
      mv ../sqlite-src-3540100/* .
  - name: Configure
    runs: |
      _amalgamation="-DSQLITE_ENABLE_FTS4 \
        -DSQLITE_ENABLE_FTS3_PARENTHESIS \
        -DSQLITE_ENABLE_FTS3 \
        -DSQLITE_ENABLE_FTS5 \
        -DSQLITE_ENABLE_COLUMN_METADATA \
        -DSQLITE_SECURE_DELETE \
        -DSQLITE_ENABLE_UNLOCK_NOTIFY \
        -DSQLITE_ENABLE_RTREE \
        -DSQLITE_ENABLE_GEOPOLY \
        -DSQLITE_USE_URI \
        -DSQLITE_ENABLE_DBSTAT_VTAB \
        -DSQLITE_MAX_VARIABLE_NUMBER=250000 \
        -DSQLITE_ENABLE_SESSION \
        -DSQLITE_ENABLE_PREUPDATE_HOOK"
      export CFLAGS="$CFLAGS $_amalgamation"
      ./configure \
      	--host=x86_64-pc-linux-gnu \
      	--prefix=/usr \
      	--soname=legacy \
      	--enable-threadsafe \
      	--enable-readline \
      	--enable-static \
      	--enable-load-extension \
      	--enable-fts3
      make "-j$(nproc)" V=1
      make tclextension-install
  - uses: autoconf/make-install
    pipeline:
      - runs: |
          make -C "." install DESTDIR="/home/build/melange-out/sqlite" V=1
      - runs: |
          find /home/build/melange-out/sqlite -name '*.la' -print -exec rm \{} \;
  - uses: strip
    pipeline:
      - runs: |
          case "x86_64" in
          x86_64) native_mach="EM_X86_64" ;;
          aarch64) native_mach="EM_AARCH64" ;;
          *)
          	echo "strip: unsupported architecture: x86_64" >&2
          	exit 1
          	;;
          esac
          scanelf --recursive --nobanner --osabi --format "%a %o %F" --etype "ET_DYN,ET_EXEC" . |
          	while read mach osabi filename; do

          		[ "$osabi" != "STANDALONE" ] || continue
          		[ "$mach" = "$native_mach" ] || continue

          		[ -e "$filename" ] || continue
          		strip -g "${filename}"
          	done
        working-directory: /home/build/melange-out/sqlite
subpackages:
  - name: sqlite-dev
    pipeline:
      - uses: split/dev
        pipeline:
          - runs: |
              PACKAGE_DIR="/home/build/melange-out/sqlite"
              if [ -n "" ]; then
              	PACKAGE_DIR="/home/build/melange-out/"
              fi
              if [ "$PACKAGE_DIR" = "/home/build/melange-out/sqlite-dev" ]; then
              	echo "ERROR: Package can not split files from itself!" && exit 1
              fi
              cd "$PACKAGE_DIR" || exit 0
              prefix="/usr"
              while [ "${prefix#/}" != "$prefix" ]; do
              	prefix="${prefix#/}"
              done
              libdirs="${prefix}/"
              if [ "${prefix%%/*}" = "usr" ] && [ -d lib/ ]; then

              	libdirs="lib/ $libdirs"
              fi
              for i in "${prefix}"/include "${prefix}"/lib/pkgconfig "${prefix}"/share/pkgconfig \
              	"${prefix}"/share/aclocal "${prefix}"/share/gettext \
              	"${prefix}"/bin/*-config "${prefix}"/bin/*_config "${prefix}"/share/vala/vapi \
              	"${prefix}"/share/gir-[0-9]* "${prefix}"/share/qt*/mkspecs \
              	"${prefix}"/lib/qt*/mkspecs \
              	"${prefix}"/lib/cmake "${prefix}"/share/cmake \
              	"${prefix}"/lib/glade/modules "${prefix}"/share/glade/catalogs \
              	$(find . -name include -type d) \
              	$(find $libdirs -name '*.a' 2>/dev/null) \
              	$(find $libdirs -name '*.[cho]' \
              		-o -name '*.prl' 2>/dev/null); do
              	if [ -e "$PACKAGE_DIR/$i" ] || [ -L "$PACKAGE_DIR/$i" ]; then
              		d="/home/build/melange-out/sqlite-dev/${i%/*}"
              		mkdir -p "$d"
              		mv "$PACKAGE_DIR/$i" "$d"
              		rmdir "$PACKAGE_DIR/${i%/*}" 2>/dev/null || :
              	fi
              done
              sodirs="$prefix/lib"
              case "$prefix" in
              usr)
              	sodirs="lib $sodirs"
              	;;
              */usr)
              	sodirs="${prefix%/*}/lib $sodirs"
              	;;
              esac
              for sodir in $sodirs; do
              	for i in "$sodir"/*.so; do
              		if [ -L "$i" ]; then
              			mkdir -p "/home/build/melange-out/sqlite-dev"/"${i%/*}"
              			mv "$i" "/home/build/melange-out/sqlite-dev/$i" || return 1
              		fi
              	done
              done
    dependencies:
      runtime:
        - sqlite
    description: sqlite headers
    commit: b0ca8c95606371be2557980059c10b34df30fa9f
    test:
      environment:
        contents:
          packages:
            - ldd-check
            - pkgconf
            - sqlite-dev
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - uses: test/pkgconf
          pipeline:
            - name: pkgconf build dependency check
              runs: |
                dev_pkg=$(basename /home/build/melange-out/sqlite-dev)
                cd /
                pc_files=false
                for pc_file in $(apk info -L "$dev_pkg" 2>/dev/null | grep "\.pc$"); do
                	pc_files=true

                	if grep -q "^Name:" $pc_file; then
                		lib_name=$(basename "$pc_file" ".pc")

                		pc_paths="/usr/lib/pkgconfig /usr/share/pkgconfig"
                		if [ -n "$PKG_CONFIG_PATH" ]; then

                			for path in $(echo "$PKG_CONFIG_PATH" | tr ':' ' '); do
                				pc_paths="$pc_paths $path"
                			done
                		fi
                		found=false
                		for path in $pc_paths; do
                			[ -e "${path}/${lib_name}.pc" ] || continue
                			found=true
                			break
                		done
                		if [ "$found" = "false" ]; then
                			echo "Error: $pc_file not in valid pkgconfig paths" && exit 1
                		fi

                		pkgconf --exists $lib_name || pkgconf --print-errors --exists $lib_name

                		if grep -q "^Version:" $pc_file; then
                			pkgconf --modversion $lib_name
                		fi

                		if grep -q "^Libs:" $pc_file; then
                			pkgconf --libs $lib_name
                		fi

                		if grep -q "^Cflags:" $pc_file; then
                			pkgconf --cflags $lib_name
                		fi
                	fi
                done
                if [ $pc_files = "false" ]; then
                	echo "No .pc files found in $dev_pkg please remove the pkgconf test"
                fi
        - uses: test/tw/ldd-check
          pipeline:
            - name: check for missing library dependencies using ldd
              runs: |
                ldd-check \
                	--files="" \
                	--exclude-files="" \
                	--packages="sqlite-dev" \
                	--extra-library-paths="" \
                	--verbose="false"
  - name: sqlite-doc
    pipeline:
      - uses: split/manpages
        pipeline:
          - runs: |
              PACKAGE_DIR="/home/build/melange-out/sqlite"
              if [ -n "" ]; then
              	PACKAGE_DIR="/home/build/melange-out/"
              fi
              if [ "$PACKAGE_DIR" = "/home/build/melange-out/sqlite-doc" ]; then
              	echo "ERROR: Package can not split files from itself!" && exit 1
              fi
              case "false" in
              true | false) ;;
              *)
              	echo "ERROR: preserve-path must be \"true\" or \"false\", got \"false\"" >&2
              	exit 1
              	;;
              esac
              merge_tree() {
              	local src="$1" dst="$2" entry name
              	mkdir -p "$dst"
              	for entry in "$src"/* "$src"/.[!.]* "$src"/..?*; do

              		[ -e "$entry" ] || [ -L "$entry" ] || continue
              		name="${entry##*/}"

              		if [ -d "$entry" ] && [ ! -L "$entry" ]; then
              			if [ -d "$dst/$name" ] && [ ! -L "$dst/$name" ]; then
              				merge_tree "$entry" "$dst/$name"
              				rmdir "$entry"
              			elif [ -e "$dst/$name" ] || [ -L "$dst/$name" ]; then
              				echo "ERROR: cannot merge $entry into $dst/$name: destination exists and is not a directory" >&2
              				exit 1
              			else
              				mv "$entry" "$dst/$name"
              			fi
              		elif [ -e "$dst/$name" ] || [ -L "$dst/$name" ]; then
              			echo "ERROR: $name is present in more than one man root; refusing to overwrite $dst/$name" >&2
              			exit 1
              		else
              			mv "$entry" "$dst/$name"
              		fi
              	done
              }
              split_root() {
              	local root="$1" dest="$2"

              	if [ -L "$PACKAGE_DIR/$root" ]; then
              		echo "ERROR: $root is a symlink to a directory; name its target in paths instead" >&2
              		exit 1
              	fi

              	if [ -z "$(ls -A "$PACKAGE_DIR/$root")" ]; then
              		echo "ERROR: $root exists but contains no files; the install step did not put manuals there" >&2
              		exit 1
              	fi

              	if [ -e "$dest" ] || [ -L "$dest" ]; then
              		merge_tree "$PACKAGE_DIR/$root" "$dest"
              	else

              		mkdir -p "$(dirname "$dest")"
              		mv "$PACKAGE_DIR/$root" "$dest"
              	fi

              	if [ -d "$PACKAGE_DIR/$root" ]; then
              		rmdir --parents --ignore-fail-on-non-empty "$PACKAGE_DIR/$root"
              	else
              		rmdir --parents --ignore-fail-on-non-empty "$(dirname "$PACKAGE_DIR/$root")"
              	fi
              }
              for root in usr/share/man usr/local/share/man usr/man; do
              	[ -d "$PACKAGE_DIR/$root" ] || continue
              	split_root "$root" "/home/build/melange-out/sqlite-doc/usr/share/man"
              done
              paths=""
              set -f
              extra=""
              for root in $paths; do
              	case "$root" in
              	/*)
              		echo "ERROR: paths entry \"$root\" must be relative to the package root" >&2
              		exit 1
              		;;
              	.. | ../* | */.. | */../*)

              		echo "ERROR: paths entry \"$root\" must not contain a \"..\" component" >&2
              		exit 1
              		;;
              	. | ./* | */. | */./*)

              		echo "ERROR: paths entry \"$root\" must not contain a \".\" component" >&2
              		exit 1
              		;;
              	*[\*\?\[]*)
              		echo "ERROR: paths entry \"$root\" must not contain a glob pattern; name each directory" >&2
              		exit 1
              		;;
              	esac
              	extra="$extra $root"
              done
              set +f
              for root in $extra; do

              	if [ ! -d "$PACKAGE_DIR/$root" ]; then
              		echo "ERROR: paths entry \"$root\" does not exist in the package" >&2
              		exit 1
              	fi

              	if [ "false" = "true" ]; then

              		split_root "$root" "/home/build/melange-out/sqlite-doc/$root"
              	else
              		split_root "$root" "/home/build/melange-out/sqlite-doc/usr/share/man"
              	fi
              done
    description: sqlite documentation
    commit: b0ca8c95606371be2557980059c10b34df30fa9f
    test:
      environment:
        contents:
          packages:
            - apk-tools
            - grep
            - man-db
            - sqlite-doc
            - texinfo
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - uses: test/docs
          pipeline:
            - name: docs readability check
              runs: |
                doc_pkg=$(basename /home/build/melange-out/sqlite-doc)
                if [ $(apk info -qL "$doc_pkg" | grep -v "^var/lib/db/sbom" | grep -v "^$" | wc -l) -eq 0 ]; then
                	echo "See:"
                	apk info -qL "$doc_pkg"
                	echo "This package [$doc_pkg] is completely empty (i.e. installs no files)."
                	echo "Please check the package build for proper docs installation, and either:"
                	echo "  (a) fix the docs subpackage build to actually include documentation (check the split/manpages and split/infodir pipelines), or"
                	echo "  (b) remove the test/docs pipeline (if for some reason we want an empty docs package), or"
                	echo "  (c) remove the docs subpackage entirely"
                	exit 1
                fi
                cd /
                doc_files=false
                for doc_file in $(apk info -qL "$doc_pkg" | grep "^usr/share/man/" | grep -v "^usr/share/man/db/"); do
                	if [ -f /"$doc_file" ]; then

                		man -l /"$doc_file" >/dev/null
                		doc_files=true
                	fi
                done
                for doc_file in $(apk info -qL "$doc_pkg" | grep "^usr/share/info/"); do
                	if [ -f /"$doc_file" ]; then

                		[ $(info -f /"$doc_file" -o - | wc -l) -gt 0 ] && doc_files=true
                	fi
                done
                for doc_file in $(apk info -qL "$doc_pkg" | grep "^usr/share/"); do
                	if [ -f /"$doc_file" ]; then

                		cat /"$doc_file" >/dev/null
                		doc_files=true
                	fi
                done
                if [ $doc_files = "false" ]; then
                	echo "See:"
                	apk info -qL "$doc_pkg"
                	echo "This package [$doc_pkg] installs files, but no usable documentation"
                	echo "Please check the package build for proper docs installation, and either:"
                	echo "  (a) fix the docs subpackage build to actually include docs (check the split/manpages and split/infodir pipelines), or"
                	echo "  (b) remove the test/docs pipeline"
                	exit 1
                fi
  - name: sqlite-libs
    pipeline:
      - runs: |
          mkdir -p "/home/build/melange-out/sqlite-libs"/usr
          mv "/home/build/melange-out/sqlite"/usr/lib "/home/build/melange-out/sqlite-libs"/usr/
    description: sqlite library
    commit: b0ca8c95606371be2557980059c10b34df30fa9f
    test:
      environment:
        contents:
          packages:
            - ldd-check
            - sqlite-libs
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - uses: test/tw/ldd-check
          pipeline:
            - name: check for missing library dependencies using ldd
              runs: |
                ldd-check \
                	--files="" \
                	--exclude-files="" \
                	--packages="sqlite-libs" \
                	--extra-library-paths="" \
                	--verbose="false"
update:
  enabled: true
  manual: false
  require-sequential: false
  release-monitor:
    identifier: 4877
var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\.(\d+)$
    replace: ${1}${2}0${3}00
    to: sqlite-download-version
test:
  environment:
    contents:
      packages:
        - ldd-check
        - sqlite
        - tcl
    accounts:
      run-as: ""
      users:
        - username: build
          uid: 1000
          gid: 1000
          shell: ""
          homedir: ""
      groups:
        - groupname: build
          gid: 1000
          members:
            - build
  pipeline:
    - uses: test/tw/ldd-check
      pipeline:
        - name: check for missing library dependencies using ldd
          runs: |
            ldd-check \
            	--files="" \
            	--exclude-files="" \
            	--packages="sqlite" \
            	--extra-library-paths="" \
            	--verbose="false"
    - name: version check
      runs: |
        sqlite3 --version
        sqlite3 help
    - name: basic test
      runs: |
        sqlite3 /tmp/test.db "CREATE TABLE test (id INT, name TEXT); INSERT INTO test VALUES (1, 'hello'); SELECT * FROM test;"
        for i in $(seq 2 100); do
        	sqlite3 /tmp/test.db "INSERT INTO test VALUES ($i, '$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 13)');"
        done
        sqlite3 /tmp/test.db "SELECT * FROM test;"
    - name: more sqlite tests
      runs: |
        sqlite3 -header -csv /tmp/test.db "SELECT * FROM test LIMIT 5;"
        sqlite3 /tmp/test.db "SELECT * FROM test WHERE id > 50 LIMIT 5;"
        sqlite3 /tmp/test.db ".schema"
        sqlite3 /tmp/test.db "SELECT COUNT(*) FROM test;"
    - name: Jamon's Test
      runs: |
        cat <<EOF | tclsh
        puts [info tclversion]
        package require sqlite3

        # Open sqlite.db file
        sqlite3 db sqlite.db

        # Create users table
        db eval {CREATE TABLE IF NOT EXISTS users (firstname TEXT, lastname TEXT);}

        # Show schema
        puts "Database schema:"
        puts [db eval {SELECT sql FROM sqlite_master WHERE type='table';}]

        # Close database
        db close
        EOF
