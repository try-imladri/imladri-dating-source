          			[ "$tagobj" != "$expcommit" ] &&
          				msg "tag object hash was $tagobj"
          			fail "Expected commit $expcommit for $tag, found $foundcommit"
          		fi

          		msg "Warning: The provided expected-commit ($expcommit)"
          		msg "was the hash of the annotated tag object for $tag."
          		msg "Update to set expected-commit to $foundcommit"
          	fi

          	process_cherry_picks "$cherry_pick" ||
          		fail "failed to apply cherry-pick"

          	return 0
          }
          cpickf=$(mktemp) || {
          	echo "failed mktemp"
          	exit 1
          }
          cat >"$cpickf" <<"END_CHERRY_PICKS"

          END_CHERRY_PICKS
          main \
          	"https://github.com/ThomasDickey/ncurses-snapshots" "." \
          	"unset" "" \
          	"v6_6_20261107" "7404b376832583182c52722dc09d86b8675db375" \
          	"false" "$cpickf" \
          	"" \
          	"3" "2" \
          	"60" \
          	"false" "1" \
          	"false"
          stash_source "." "7404b376832583182c52722dc09d86b8675db375" \
          	"https://github.com/ThomasDickey/ncurses-snapshots" "false" "v6_6_20261107" \
          	""
          rm -f "$cpickf"
