            }
            EOF
            gcc $(pkg-config --cflags ncurses) /tmp/test_ncurses.c -o /tmp/test_ncurses $(pkg-config --libs ncurses)
            /tmp/test_ncurses | grep -F "ncurses header version:"
        - name: Test compile and link with ncursesw
          runs: |
            tee /tmp/test_ncursesw.c <<'EOF'
            #include <ncurses.h>
            #include <locale.h>
            #include <stdio.h>
            #include <stdlib.h>
            #include <string.h>

            int main(void) {
                setlocale(LC_ALL, "");

                FILE *out = tmpfile();   // curses output lands here so we can inspect it
                if (!out) {
                    fprintf(stderr, "FAIL: cannot create temp file\n");
                    return 1;
                }

                const char *term = getenv("TERM");
                if (!term || !*term || strcmp(term, "dumb") == 0)
                    term = "xterm";

                SCREEN *scr = newterm(term, out, stdin);
                if (scr == NULL) {
                    fprintf(stderr, "FAIL: newterm() returned NULL\n");
                    return 1;
                }

                int ok = (addwstr(L"café — ω — 日本語 — €") != ERR) && (refresh() != ERR);
                const char *ver = curses_version();

                endwin();
                delscreen(scr);

                fflush(out);
                long bytes = ftell(out);   // total bytes curses wrote
                fclose(out);

                if (ok && bytes > 0 && ver) {
                    fprintf(stderr, "PASS: libncursesw working, %ld bytes emitted (%s)\n", bytes, ver);
                    return 0;
                }
                fprintf(stderr, "FAIL: ok=%d bytes=%ld\n", ok, bytes);
                return 1;
            }
            EOF
            gcc $(pkg-config --cflags ncursesw) /tmp/test_ncursesw.c -o /tmp/test_ncursesw $(pkg-config --libs ncursesw)
            /tmp/test_ncursesw
  - name: ncurses-doc
    pipeline:
      - uses: split/manpages
        pipeline:
          - runs: |
              PACKAGE_DIR="/home/build/melange-out/ncurses"
              if [ -n "" ]; then
              	PACKAGE_DIR="/home/build/melange-out/"
              fi
              if [ "$PACKAGE_DIR" = "/home/build/melange-out/ncurses-doc" ]; then
              	echo "ERROR: Package can not split files from itself!" && exit 1
              fi
              case "false" in
              true | false) ;;
              *)
              	echo "ERROR: preserve-path must be \"true\" or \"false\", got \"false\"" >&2
              	exit 1
              	;;
              esac
              merge_tree() {
              	local src="$1" dst="$2" entry name
              	mkdir -p "$dst"
              	for entry in "$src"/* "$src"/.[!.]* "$src"/..?*; do

              		[ -e "$entry" ] || [ -L "$entry" ] || continue
              		name="${entry##*/}"

              		if [ -d "$entry" ] && [ ! -L "$entry" ]; then
              			if [ -d "$dst/$name" ] && [ ! -L "$dst/$name" ]; then
              				merge_tree "$entry" "$dst/$name"
              				rmdir "$entry"
              			elif [ -e "$dst/$name" ] || [ -L "$dst/$name" ]; then
              				echo "ERROR: cannot merge $entry into $dst/$name: destination exists and is not a directory" >&2
              				exit 1
              			else
              				mv "$entry" "$dst/$name"
              			fi
              		elif [ -e "$dst/$name" ] || [ -L "$dst/$name" ]; then
              			echo "ERROR: $name is present in more than one man root; refusing to overwrite $dst/$name" >&2
              			exit 1
              		else
              			mv "$entry" "$dst/$name"
              		fi
              	done
              }
              split_root() {
              	local root="$1" dest="$2"

              	if [ -L "$PACKAGE_DIR/$root" ]; then
              		echo "ERROR: $root is a symlink to a directory; name its target in paths instead" >&2
              		exit 1
              	fi

              	if [ -z "$(ls -A "$PACKAGE_DIR/$root")" ]; then
              		echo "ERROR: $root exists but contains no files; the install step did not put manuals there" >&2
              		exit 1
              	fi

              	if [ -e "$dest" ] || [ -L "$dest" ]; then
              		merge_tree "$PACKAGE_DIR/$root" "$dest"
              	else

              		mkdir -p "$(dirname "$dest")"
              		mv "$PACKAGE_DIR/$root" "$dest"
              	fi

              	if [ -d "$PACKAGE_DIR/$root" ]; then
              		rmdir --parents --ignore-fail-on-non-empty "$PACKAGE_DIR/$root"
              	else
              		rmdir --parents --ignore-fail-on-non-empty "$(dirname "$PACKAGE_DIR/$root")"
              	fi
              }
              for root in usr/share/man usr/local/share/man usr/man; do
              	[ -d "$PACKAGE_DIR/$root" ] || continue
              	split_root "$root" "/home/build/melange-out/ncurses-doc/usr/share/man"
              done
              paths=""
              set -f
              extra=""
              for root in $paths; do
              	case "$root" in
              	/*)
              		echo "ERROR: paths entry \"$root\" must be relative to the package root" >&2
              		exit 1
              		;;
              	.. | ../* | */.. | */../*)

              		echo "ERROR: paths entry \"$root\" must not contain a \"..\" component" >&2
              		exit 1
              		;;
              	. | ./* | */. | */./*)

              		echo "ERROR: paths entry \"$root\" must not contain a \".\" component" >&2
              		exit 1
              		;;
              	*[\*\?\[]*)
              		echo "ERROR: paths entry \"$root\" must not contain a glob pattern; name each directory" >&2
              		exit 1
              		;;
              	esac
              	extra="$extra $root"
              done
              set +f
              for root in $extra; do

              	if [ ! -d "$PACKAGE_DIR/$root" ]; then
              		echo "ERROR: paths entry \"$root\" does not exist in the package" >&2
              		exit 1
              	fi

              	if [ "false" = "true" ]; then

              		split_root "$root" "/home/build/melange-out/ncurses-doc/$root"
              	else
              		split_root "$root" "/home/build/melange-out/ncurses-doc/usr/share/man"
              	fi
              done
