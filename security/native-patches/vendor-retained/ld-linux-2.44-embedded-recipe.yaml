          [ -d "/home/build/melange-out/glibc-2.44"/usr/lib/locale/fr ] &&
          	mv "/home/build/melange-out/glibc-2.44"/usr/lib/locale/fr "/home/build/melange-out/glibc-2.44-locale-fr"/usr/lib/locale/
          rdfind -makehardlinks true "/home/build/melange-out/glibc-2.44-locale-fr"/usr/lib/locale/
    dependencies:
      runtime:
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - glibc-locale-fr=2.44-r17
    description: French locale data for glibc
    commit: a30791222f1e1fecc94f7a1a6660c8e0f7df146e
    test:
      environment:
        contents:
          packages:
            - glibc-2.44-locale-fr
            - posix-libc-utils-2.44
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - runs: |
            set -euo pipefail
            pkg=glibc-locale-fr
            out=$(locale --all-locales) || {
            	echo "FAIL: locale --all-locales failed for $pkg"
            	exit 1
            }
            matches=$(echo "$out" | grep "^fr") || {
            	echo "FAIL: $pkg did not install any locales per 'locale --all-locales'"
            	echo "$ locale --all-locales"
            	echo "$out"
            	exit 1
            }
            echo "PASS: $pkg shipped" $matches
  - name: glibc-2.44-locale-extra
    pipeline:
      - runs: |
          mkdir -p "/home/build/melange-out/glibc-2.44-locale-extra"/usr/lib/locale
          mv "/home/build/melange-out/glibc-2.44"/usr/lib/locale/* "/home/build/melange-out/glibc-2.44-locale-extra"/usr/lib/locale/
          rdfind -makehardlinks true "/home/build/melange-out/glibc-2.44-locale-extra"/usr/lib/locale/
    dependencies:
      runtime:
        - merged-sbin
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - glibc-locale-extra=2.44-r17
    description: All other extra locale data for glibc
    commit: a30791222f1e1fecc94f7a1a6660c8e0f7df146e
    test:
      environment:
        contents:
          packages:
            - glibc-2.44-locale-extra
            - posix-libc-utils-2.44
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - runs: |
            set -euo pipefail
            pkg=glibc-locale-extra
            out=$(locale --all-locales) || {
            	echo "FAIL: locale --all-locales failed for $pkg"
            	exit 1
            }
            for lang in ca de en es fr; do
            	matches=$(echo "$out" | grep "^$lang") && {
            		echo "FAIL: $pkg installs one of the stand-alone-package locales"
            		echo "$ locale --all-locales"
            		echo "$out"
            		exit 1
            	}
            done
            echo "PASS: $pkg correctly does not ship main locales"
  - name: libc-bin-2.44
    dependencies:
      runtime:
        - localedef-2.44
        - merged-lib
        - merged-sbin
        - merged-usrsbin
        - posix-libc-utils-2.44
        - tzutils-2.44
        - wolfi-baselayout
      provides:
        - libc-bin=2.44-r17
    description: 'GNU C Library: Binaries'
    commit: a30791222f1e1fecc94f7a1a6660c8e0f7df146e
    checks:
      disabled:
        - empty
    test:
      environment:
        contents:
          packages:
            - libc-bin-2.44
        accounts:
          run-as: ""
          users:
            - username: build
              uid: 1000
              gid: 1000
              shell: ""
              homedir: ""
          groups:
            - groupname: build
              gid: 1000
              members:
                - build
      pipeline:
        - uses: test/emptypackage
          pipeline:
            - name: empty package check
              runs: |
                pkg=$(basename /home/build/melange-out/libc-bin-2.44)
                if [ $(apk info -qL "$pkg" | grep -v "^$" | wc -l) -le 1 ] && (apk info -qL "$pkg" | grep -q ".spdx.json$"); then
                	echo "Package [$pkg] seems to be empty, as expected"
                else
                	echo "Expected this package [$pkg] to be empty, but it isn't:"
                	apk info -qL "$pkg"
                	exit 1
                fi
update:
  enabled: true
  manual: false
  require-sequential: false
  git: {}
  schedule:
    reason: We are building from the release branch, which isn't tagged.
    period: weekly
vars:
  charsets-to-remove: IBM1390 IBM1399
var-transforms:
  - from: ${{package.version}}
    match: ([0-9])[.]([0-9]+)
    replace: $1$2
    to: provider-priority
test:
  environment:
    contents:
      packages:
        - glibc-2.44
        - help-check
        - ldd-check
        - ver-check
    accounts:
      run-as: ""
      users:
        - username: build
          uid: 1000
          gid: 1000
          shell: ""
          homedir: ""
      groups:
        - groupname: build
          gid: 1000
          members:
            - build
  pipeline:
    - runs: |
        set -euo pipefail
        cd /usr/lib/locale
        locales=$(ls | grep -v C.utf8) || locales=""
        if [[ -n "${locales}" ]]; then
        	for locale in ${locales}; do
        		echo "Error: locale $locale found in main glibc package"
        	done
        	exit 1
        fi
    - uses: test/tw/ldd-check
      pipeline:
        - name: check for missing library dependencies using ldd
          runs: |
            ldd-check \
            	--files="" \
            	--exclude-files="" \
            	--packages="glibc-2.44" \
            	--extra-library-paths="" \
            	--verbose="false"
    - uses: test/tw/help-check
      with:
        bins: |
          ldconfig
          ld.so
      pipeline:
        - name: check help information for binaries
          runs: |
            help-check \
            	--bins="ldconfig
            ld.so
            " \
            	--help-flag="auto" \
            	--expect-contains="" \
            	--verbose="false"
    - uses: test/tw/ver-check
      with:
        bins: |
          ldconfig
          ld.so
        version: "2.44"
      pipeline:
        - name: check version information for binaries
          runs: |
            ver-check \
            	--bins="ldconfig
            ld.so
            " \
            	--version="2.44" \
            	--version-flag="auto" \
            	--match-type="contains" \
            	--verbose="false"
    - name: Verify apk bootstrap works
      runs: |
        set -euo pipefail
        check_bootstrap_log() {
        	local log="$1"
        	cat "$log"

        	if grep -e "ERROR:" "$log" | grep -v "updating directory permissions" >errors.log; then
        		echo "Unexpected errors found in bootstrap log:"
        		cat errors.log
        		exit 1
        	fi
        }
        mkdir -p /tmp/glibc-bash/etc/apk
        cp -r /etc/apk/repositories /etc/apk/keys /tmp/glibc-bash/etc/apk
        apk add --initdb --root /tmp/glibc-bash glibc bash-binsh &>bootstrap.log || :
        check_bootstrap_log bootstrap.log
        mkdir -p /tmp/glibc-busybox/etc/apk
        cp -r /etc/apk/repositories /etc/apk/keys /tmp/glibc-busybox/etc/apk
        apk add --initdb --root /tmp/glibc-busybox glibc busybox &>bootstrap.log || :
        check_bootstrap_log bootstrap.log
    - name: Verify version-streamed virtuals do not resolve to an older package
      runs: |
        expected="2.44-r17"
        virtuals="
          glibc
          glibc-abi-report
          glibc-dev
          glibc-iconv
          glibc-locale-ca
          glibc-locale-de
          glibc-locale-en
          glibc-locale-es
          glibc-locale-extra
          glibc-locale-fr
          glibc-locale-posix
          glibc-locales
          glibc-testresults
          glibc-tracing
          ld-linux
          libc-bin
          libcrypt1
          localedef
          nscd
          nss-db
          nss-hesiod
          pcprofiledump
          posix-libc-utils
          posix-libc-utils-bin
          sln
          sotruss
          tzutils
        "
        installed_version() {
        	awk -v want="$1" '
            BEGIN { RS = "" }
            {
              pkg = ""; ver = ""; prov = ""
              n = split($0, lines, "\n")
              for (i = 1; i <= n; i++) {
                if (lines[i] ~ /^P:/)      pkg  = substr(lines[i], 3)
                else if (lines[i] ~ /^V:/) ver  = substr(lines[i], 3)
                else if (lines[i] ~ /^p:/) prov = substr(lines[i], 3)
              }
              matched = (pkg == want)
              if (!matched) {
                m = split(prov, provs, " ")
                for (j = 1; j <= m; j++) {
                  name = provs[j]; sub(/=.*/, "", name)
                  if (name == want) { matched = 1; break }
                }
              }
              if (matched) { print ver; exit }
            }
          ' "$2/lib/apk/db/installed"
        }
        rc=0
        for v in $virtuals; do
        	root="$(mktemp -d)"
        	mkdir -p "$root/etc/apk"
        	cp -r /etc/apk/repositories /etc/apk/keys "$root/etc/apk/"
        	if ! apk add --initdb --root "$root" glibc "$v" >"$root/add.log" 2>&1; then
        		echo "FAIL: apk add glibc-2.44 $v failed to solve"
        		cat "$root/add.log"
        		rc=1
        		rm -rf "$root"
        		continue
        	fi
        	got="$(installed_version "$v" "$root")"
        	if [ -z "$got" ]; then
        		echo "FAIL: apk add glibc-2.44 $v installed nothing satisfying $v"
        		rc=1
        		rm -rf "$root"
        		continue
        	fi
        	rel="$(apk version -t "$got" "$expected" || true)"
        	if [ "$rel" = "<" ]; then
        		echo "FAIL: apk add glibc-2.44 $v resolved $v to $got, expected >= $expected"
        		rc=1
        	else
        		echo "PASS: $v resolved to $got (>= $expected)"
        	fi
        	rm -rf "$root"
        done
        exit $rc
