              		if ! contains "$c" "${pattern}" && ! contains "$c" "${replacement}"; then
              			delim="$c"
              			break
              		fi
              	done
              	if [ -z "${delim}" ]; then
              		echo "ERROR: sed pipeline: could not auto-select a delimiter absent from pattern and replacement; set 'delimiter' explicitly" >&2
              		exit 1
              	fi
              fi
              sed -E -i "s${delim}${pattern}${delim}${replacement}${delim}g" /home/build/melange-out/glibc-2.44-dev/usr/lib/libm.so
      - name: Point libm.so AS_NEEDED at our pinned libmvec copy
        uses: sed
        with:
          path: /home/build/melange-out/glibc-2.44-dev/usr/lib/libm.so
          pattern: /usr/lib/libmvec\.so\.1
          replacement: /usr/lib/libmvec.so
        pipeline:
          - name: Guarded sed substitution
            runs: |
              set -euo pipefail
              pattern=$(
              	cat <<'SED_PIPELINE_PATTERN_END'
              /usr/lib/libmvec\.so\.1
              SED_PIPELINE_PATTERN_END
              )
              replacement=$(
              	cat <<'SED_PIPELINE_REPLACEMENT_END'
              /usr/lib/libmvec.so
              SED_PIPELINE_REPLACEMENT_END
              )
              delim=$(
              	cat <<'SED_PIPELINE_DELIMITER_END'

              SED_PIPELINE_DELIMITER_END
              )
              if ! grep -Eq -- "${pattern}" /home/build/melange-out/glibc-2.44-dev/usr/lib/libm.so; then
              	echo "ERROR: sed pipeline: pattern not found in any matched file, refusing to run a no-op substitution: ${pattern}" >&2
              	exit 1
              fi
              contains() {
              	case "$2" in
              	*"$1"*) return 0 ;;
              	*) return 1 ;;
              	esac
              }
              if [ -n "${delim}" ]; then
              	if [ "${#delim}" -ne 1 ]; then
              		echo "ERROR: sed pipeline: delimiter must be a single character: '${delim}'" >&2
              		exit 1
              	fi
              	if contains "${delim}" "${pattern}" || contains "${delim}" "${replacement}"; then
              		echo "ERROR: sed pipeline: delimiter '${delim}' occurs in pattern or replacement; pick another" >&2
              		exit 1
              	fi
              else
              	for c in '/' '|' '#' '@' ',' ':' ';' '!' '%'; do
              		if ! contains "$c" "${pattern}" && ! contains "$c" "${replacement}"; then
              			delim="$c"
              			break
              		fi
              	done
              	if [ -z "${delim}" ]; then
              		echo "ERROR: sed pipeline: could not auto-select a delimiter absent from pattern and replacement; set 'delimiter' explicitly" >&2
              		exit 1
              	fi
              fi
              sed -E -i "s${delim}${pattern}${delim}${replacement}${delim}g" /home/build/melange-out/glibc-2.44-dev/usr/lib/libm.so
